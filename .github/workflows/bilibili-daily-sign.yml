name: Bilibili Daily Sign

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Bilibili sign
        env:
          SESSDATA: ${{ secrets.SESSDATA }}
          bili_jct: ${{ secrets.bili_jct }}
          DedeUserID: ${{ secrets.DedeUserID }}
        run: python3 scripts/bilibili_sign.py
