name: Bilibili Daily Experience Tasks

on:
  workflow_dispatch:
  schedule:
    - cron: "5 18-23,0-11 * * *"

permissions:
  contents: write

jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest records
        run: git pull --ff-only

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Record today's Bilibili hot search
        continue-on-error: true
        run: python3 scripts/record_hot_search.py

      - name: Record today's Bilibili popular videos
        continue-on-error: true
        run: python3 scripts/record_popular.py

      - name: Record today's Bilibili ranking
        continue-on-error: true
        run: python3 scripts/record_ranking.py

      - name: Run Bilibili experience tasks for all accounts
        env:
          SESSDATA: ${{ secrets.SESSDATA }}
          BILI_JCT: ${{ secrets.BILI_JCT }}
          DEDEUSERID: ${{ secrets.DEDEUSERID }}
          BUVID3: ${{ secrets.BUVID3 }}
          SESSDATA2: ${{ secrets.SESSDATA2 }}
          BILI_JCT2: ${{ secrets.BILI_JCT2 }}
          DEDEUSERID2: ${{ secrets.DEDEUSERID2 }}
          BUVID32: ${{ secrets.BUVID32 }}
          SESSDATA3: ${{ secrets.SESSDATA3 }}
          BILI_JCT3: ${{ secrets.BILI_JCT3 }}
          DEDEUSERID3: ${{ secrets.DEDEUSERID3 }}
          BUVID33: ${{ secrets.BUVID33 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          RESEND_API_KEY3: ${{ secrets.RESEND_API_KEY3 }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          status=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode=""
          else
            mode="--scheduled"
          fi

          SESSDATA="$SESSDATA" BILI_JCT="$BILI_JCT" DEDEUSERID="$DEDEUSERID" BUVID3="$BUVID3" \
            python3 scripts/bilibili_sign.py $mode --account huang1988pioneer || status=1
          SESSDATA="$SESSDATA2" BILI_JCT="$BILI_JCT2" DEDEUSERID="$DEDEUSERID2" BUVID3="$BUVID32" \
            python3 scripts/bilibili_sign.py $mode --account abuhg17 || status=1
          SESSDATA="$SESSDATA3" BILI_JCT="$BILI_JCT3" DEDEUSERID="$DEDEUSERID3" BUVID3="$BUVID33" \
            python3 scripts/bilibili_sign.py $mode --account goldshoot0720 || status=1
          exit $status

      - name: Commit daily records
        if: always()
        run: |
          if [ -z "$(git status --porcelain logs)" ]; then
            echo "No daily record changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "Record Bilibili daily activity"
          git push
