name: Bilibili Daily Experience Tasks

on:
  workflow_dispatch:
  schedule:
    - cron: "5 18-23,0-11 * * *"

permissions:
  contents: write

jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest records
        run: git pull --ff-only

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run Bilibili experience tasks
        env:
          SESSDATA: ${{ secrets.SESSDATA }}
          bili_jct: ${{ secrets.bili_jct }}
          DedeUserID: ${{ secrets.DedeUserID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          EMAIL_NOTIFY_TO: ${{ secrets.EMAIL_NOTIFY_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/bilibili_sign.py
          else
            python3 scripts/bilibili_sign.py --scheduled
          fi

      - name: Commit experience records
        run: |
          if [ -z "$(git status --porcelain logs)" ]; then
            echo "No experience record changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "Record Bilibili experience run"
          git push
