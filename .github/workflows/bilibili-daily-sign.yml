name: Bilibili Daily Sign

on:
  workflow_dispatch:
  schedule:
    - cron: "5 18-23,0-5 * * *"

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest records
        run: git pull --ff-only

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Bilibili sign
        env:
          SESSDATA: ${{ secrets.SESSDATA }}
          bili_jct: ${{ secrets.bili_jct }}
          DedeUserID: ${{ secrets.DedeUserID }}
        run: python3 scripts/bilibili_sign.py --scheduled

      - name: Commit sign records
        run: |
          if [ -z "$(git status --porcelain logs)" ]; then
            echo "No sign record changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "Record Bilibili sign run"
          git push
